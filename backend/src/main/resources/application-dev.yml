spring:
  datasource:
    url: jdbc:h2:mem:fleetdev;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-client-id
            client-secret: dummy-client-secret

app:
  jwt:
    onboarding-secret: dev-secret-key-at-least-32-characters-long
    onboarding-expiration-ms: 600000

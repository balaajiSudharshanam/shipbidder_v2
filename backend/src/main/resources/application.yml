spring:
  application:
    name: fleet-management-platform

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 40MB

  mail:
    host: smtp.sendgrid.net
    port: 587
    username: apikey
    password: ${SENDGRID_API_KEY}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${SERVER_PORT:8080}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost}
  google:
    maps:
      api-key: ${GOOGLE_MAPS_API_KEY:}
  jwt:
    onboarding-secret: ${ONBOARDING_JWT_SECRET}
    onboarding-expiration-ms: 600000
    auth-secret: ${AUTH_JWT_SECRET}
    auth-expiration-ms: 86400000
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
  mail:
    from: ${MAIL_FROM:noreply@shipbidder.com}
  auction:
    grace-period-hours: ${AUCTION_GRACE_PERIOD_HOURS:24}
